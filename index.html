/* ===================== HẾT CẤU HÌNH =====================
  KHÔNG CẦN SỬA PHẦN DƯỚI NÀY. Đây là mã hiển thị tự động.

const $=id=>document.getElementById(id);
const safe=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>typeof n==='number'&&Number.isFinite(n)?n.toLocaleString('vi-VN')+'đ':'Liên hệ';
const icon=a=>`<div class="app-icon">${a.logo?`<img src="${safe(a.logo)}" alt="" onerror="this.remove();this.parentNode.textContent='${safe(a.ten.slice(0,1).toUpperCase())}'">`:safe(a.ten.slice(0,1).toUpperCase())}</div>`;
const listItems=(items,tag='li')=>(items||[]).map(x=>`<${tag}>${safe(x)}</${tag}>`).join('');
function showHome(){
 $('main').innerHTML=`<section class="hero"><div class="wrap"><div class="hero-inner"><span class="eyebrow">Cửa hàng gói ứng dụng</span><h1>Ứng dụng yêu thích,<br>gói dùng phù hợp.</h1><p class="muted">${safe(CUA_HANG.gioiThieu)}</p><a class="btn" href="#danh-sach">Khám phá sản phẩm →</a></div></div></section><section class="section" id="danh-sach"><div class="wrap"><div class="section-head"><div><h2>Danh mục ứng dụng</h2><p class="muted">Chọn ứng dụng để xem gói và giá.</p></div><input class="search" id="search" type="search" placeholder="🔎 Tìm ứng dụng..." aria-label="Tìm ứng dụng"></div><div class="grid" id="appGrid"></div></div></section>`;
 $('search').addEventListener('input',e=>drawApps(e.target.value));drawApps('');
}
function drawApps(query){let q=query.trim().toLocaleLowerCase('vi');let apps=SAN_PHAM.filter(a=>a.ten.toLocaleLowerCase('vi').includes(q));$('appGrid').innerHTML=apps.map(a=>`<article class="app-card">${icon(a)}<h3>${safe(a.ten)}</h3><p>${safe(a.moTa)}</p><a class="btn btn-outline" href="#app/${encodeURIComponent(a.id)}">Xem các gói →</a></article>`).join('')||'<p class="empty">Không tìm thấy ứng dụng phù hợp.</p>'}
function showDetail(a){
 $('main').innerHTML=`<div class="wrap detail-top"><button class="back" onclick="location.hash=''">← Quay lại danh sách</button><div class="banner" id="banner"><div class="banner-content">${icon(a)}<div><h1>${safe(a.ten)}</h1><p>${safe(a.moTa)}</p></div></div></div><div class="detail-layout"><div><section class="panel"><h2>Thông tin ứng dụng</h2><p class="muted">${safe(a.moTa)}</p><ul class="features">${listItems(a.tinhNang)}</ul></section><section class="panel"><h2>Các gói đang bán</h2><p class="muted">Chọn gói phù hợp để liên hệ đặt hàng.</p><div class="packages">${a.goi.map((p,i)=>`<article class="package"><span class="tag">${safe(p.loai||'Gói ứng dụng')}</span><h3>${safe(p.ten)}</h3><div class="duration">Thời hạn: ${safe(p.han)}</div><div class="price">${money(p.gia)}</div>${GIA_MINH_HOA?'<div class="note">Giá minh họa</div>':''}<button class="btn" onclick="openOrder('${safe(a.id)}',${i})">Đặt mua ngay →</button></article>`).join('')}</div></section><section class="panel"><h2>Hướng dẫn & điều khoản</h2><details><summary>Hướng dẫn sử dụng ${safe(a.ten)}</summary><ol>${listItems(a.huongDan)}</ol></details><details><summary>Điều khoản sử dụng ${safe(a.ten)}</summary><ul>${listItems(a.dieuKhoan)}</ul></details></section></div><aside><div class="panel"><h2>Cần tư vấn?</h2><p class="muted">Liên hệ cửa hàng để hỏi về ${safe(a.ten)}.</p><div class="contact-box"><button class="btn" style="width:100%" onclick="openOrder('${safe(a.id)}',-1)">Liên hệ về ${safe(a.ten)}</button></div></div><div class="panel"><h3>Lưu ý</h3><p class="muted">Đây là cửa hàng độc lập, không phải website chính thức của ứng dụng.</p>${GIA_MINH_HOA?'<p class="warning">Giá hiện tại chỉ là minh họa. Hãy thay bằng giá bán thật trước khi nhận đơn.</p>':''}</div></aside></div></div>`;
 if(a.banner){const b=$('banner');const img=new Image();img.onload=()=>b.style.backgroundImage=`url("${a.banner.replace(/"/g,'%22')}")`;img.src=a.banner}
}
function route(){const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('app/')){const app=SAN_PHAM.find(a=>a.id===hash.slice(4));if(app)showDetail(app);else showHome()}else showHome();window.scrollTo(0,0)}
let currentMessage='';
function openOrder(id,index){const a=SAN_PHAM.find(x=>x.id===id);if(!a)return;const p=a.goi[index];currentMessage=p?`Xin chào ${CUA_HANG.ten}!\nTôi muốn đặt gói:\nỨng dụng: ${a.ten}\nTên gói: ${p.ten}\nLoại: ${p.loai||'Không phân loại'}\nThời hạn: ${p.han}\nGiá hiển thị: ${money(p.gia)}${GIA_MINH_HOA?' (giá minh họa, vui lòng xác nhận)':''}\nNhờ cửa hàng tư vấn cách mua và sử dụng.`:`Xin chào ${CUA_HANG.ten}! Tôi muốn được tư vấn về ứng dụng ${a.ten}.`;
 $('orderText').textContent=currentMessage;const links=[['Zalo',CUA_HANG.zalo],['Facebook',CUA_HANG.facebook],['Telegram',CUA_HANG.telegram]];$('contactLinks').innerHTML=links.filter(x=>/^https:\/\//i.test(x[1])).map(([name,url])=>`<a class="btn btn-outline btn-small" target="_blank" rel="noopener noreferrer" href="${safe(url)}">Mở ${name} ↗</a>`).join('');$('contactWarning').hidden=!!links.some(x=>/^https:\/\//i.test(x[1]));$('orderDialog').classList.add('show')}
function closeOrder(){$('orderDialog').classList.remove('show')}
async function copyOrder(){try{await navigator.clipboard.writeText(currentMessage);alert('Đã sao chép nội dung đặt hàng!')}catch(e){const t=document.createElement('textarea');t.value=currentMessage;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();alert(ok?'Đã sao chép nội dung đặt hàng!':'Không thể sao chép tự động. Hãy chọn và sao chép nội dung trong hộp thoại.')}}
$('orderDialog').addEventListener('click',e=>{if(e.target===$('orderDialog'))closeOrder()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOrder()});
$('brandName').textContent=CUA_HANG.ten;$('footerName').textContent=CUA_HANG.ten;document.title=CUA_HANG.ten+' | Cửa hàng gói ứng dụng';window.addEventListener('hashchange',route);route();
</script>
